<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>First Date Coffee &amp; Kitchen — QR Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <!-- HOME SCREEN -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <div class="brand-mini">
        <div class="brand-mini__badge">F</div>
        <span class="brand-mini__name">first date</span>
      </div>
      <div class="lang">
        <span class="lang__dot"></span>
        <span>TR</span>
        <span class="lang__chev">▼</span>
      </div>
    </header>

    <div class="hero">
      <img src="https://images.unsplash.com/photo-1768319920501-2d124ccfd8dc?fm=jpg&q=70&w=1200&auto=format&fit=crop" alt="First Date Coffee & Kitchen mekan görseli" />
      <div class="hero__dots">
        <span class="on"></span><span></span><span></span>
      </div>
    </div>

    <div class="brand-row">
      <div class="brand-seal">
        <span>FIRST</span>
        <i></i>
        <span>DATE</span>
      </div>
      <div class="brand-info">
        <h1>First Date Coffee &amp; Kitchen</h1>
        <div class="handle">@firstdatekahve</div>
        <div class="tagline">"first date , filtre kahve , kahvaltı , sakin sabahlar"</div>
      </div>
    </div>

    <nav class="tabs">
      <span>Öne Çıkanlar</span>
      <span class="tabs__active" data-goto="menu">Menü</span>
      <span>Etkinlikler</span>
      <span>Geri Bildirim</span>
    </nav>

    <div class="tiles" id="tiles"></div>

    <div class="address">
      <div class="address__label">ADRES</div>
      <div class="address__text">Caferağa Mah. Sakin Sokak No 12, Kadıköy / İstanbul<br />Her gün 08:00 – 19:00</div>
    </div>
  </section>

  <!-- MENU SCREEN -->
  <section id="screen-menu" class="screen" hidden>
    <header class="menubar">
      <button class="back-btn" data-goto="home" aria-label="Geri">‹</button>
      <span class="menubar__title">Menü</span>
    </header>

    <div class="cats" id="cats"></div>

    <div class="items-wrap">
      <div class="items-head">
        <span id="active-label"></span>
        <span class="items-head__line"></span>
      </div>
      <div id="items" class="items"></div>
    </div>
  </section>

  <!-- ITEM DETAIL SHEET -->
  <div id="overlay" class="overlay" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet__bar">
      <button class="back-btn" id="sheet-close" aria-label="Kapat">✕</button>
    </div>
    <div class="sheet__scroll">
      <div class="sheet__img"><img id="sheet-img" src="" alt="" /></div>
      <h2 id="sheet-name"></h2>
      <div id="sheet-price" class="sheet__price"></div>
      <p id="sheet-desc" class="sheet__desc"></p>
      <div id="sheet-tags" class="tags"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
